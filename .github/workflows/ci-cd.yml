name: CI CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: run tests
        run: pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: build and push docker image
        uses: docker/build-push-action@v4
        with:
          push: true    
          tags: ${{ secrets.DOCKER_USERNAME}}/gdrive-search:latest

      - name: learning secrect keys
        env:
          SECRET_KEY: ${{secrets.APP_SECRET_KEY}}
        run: echo "secret key is set $SECRET_KEY"

      - name: Run container with secret
        env:
          SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: docker run -e SECRET_KEY=$SECRET_KEY ${{ secrets.maanastej}}/gdrive-search:latest